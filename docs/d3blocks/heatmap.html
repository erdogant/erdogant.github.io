<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heatmap - D3blocks</title>
<style>
:root {
  --bg: #12141c;
  --bg-gradient: radial-gradient(ellipse 120% 80% at 50% 40%, #2a3050 0%, #1a1e2e 45%, #12141c 100%);
  --panel-bg: rgba(28, 30, 40, 0.92);
  --panel-border: rgba(255, 255, 255, 0.08);
  --text: #dcddde;
  --text-muted: rgba(220, 221, 222, 0.55);
  --btn-bg: #3a3a4a;
  --btn-bg-active: #4a4a5a;
  --btn-border: #4a4a5a;
  --btn-text: #dcddde;
  --tooltip-bg: rgba(20, 20, 28, 0.95);
  --tooltip-text: #fff;
  --section-label: rgba(220, 221, 222, 0.45);
  --transition: background 0.35s, color 0.25s, border-color 0.25s;
  --accent: #1ABC9C;
  --panel-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
  --topbar-bg: rgba(18, 20, 28, 0.55);
}
body.light {
  --bg: #e4e6ec;
  --bg-gradient: radial-gradient(ellipse 120% 80% at 50% 35%, #e8eef8 0%, #f0f2f6 50%, #e4e6ec 100%);
  --panel-bg: rgba(255, 255, 255, 0.88);
  --panel-border: rgba(0, 0, 0, 0.08);
  --text: #2c2c2e;
  --text-muted: rgba(44, 44, 46, 0.5);
  --btn-bg: #e8e8ea;
  --btn-bg-active: #d8d8dc;
  --btn-border: #c8c8cc;
  --btn-text: #2c2c2e;
  --tooltip-bg: rgba(255, 255, 255, 0.96);
  --tooltip-text: #1a1a1a;
  --section-label: rgba(44, 44, 46, 0.4);
  --accent: #1ABC9C;
  --panel-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
  --topbar-bg: rgba(228, 230, 236, 0.6);
}
html, body {
  margin: 0;
  height: 100%;
  background-color: var(--bg);
  background-image: var(--bg-gradient);
  background-attachment: fixed;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  overflow: hidden;
  transition: var(--transition);
}
#heatmap-container {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
/* Leave room for the fixed top panel so the chart is not clipped under it */
body.has-controls #heatmap-container {
  top: 64px;
}
#heatmap-container svg {
  display: block;
  max-width: 100%;
  max-height: 100%;
}
/* Labels must not inherit body color transitions (avoids white→black flash) */
#heatmap-container text {
  transition: none !important;
}
#hint {
  position: fixed;
  bottom: 10px;
  left: 0;
  right: 0;
  text-align: center;
  color: var(--text);
  opacity: 0.5;
  font-size: 11px;
  z-index: 10;
  pointer-events: none;
  transition: color 0.25s;
}

/* ==== Side panels (aligned with radialgraph) ==== */
.stats-panel {
  position: fixed;
  display: flex;
  flex-direction: column;
  resize: both;
  overflow: hidden;
  top: 10px;
  left: 10px;
  z-index: 1000;
  background: var(--panel-bg);
  color: var(--text);
  border-radius: 8px;
  padding: 10px 14px;
  box-shadow: var(--panel-shadow);
  font-family: "Helvetica", Arial, sans-serif;
  font-size: 13px;
  width: 220px;
  min-width: 180px;
  max-width: min(600px, calc(100vw - 40px));
  border: 1px solid var(--panel-border);
  transition: background 0.25s, color 0.25s, border-color 0.25s;
  min-height: 40px;
  max-height: calc(100vh - 40px);
}
.stats-panel.collapsed {
  resize: none;
}
.stats-panel-body {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
}
.stats-panel .stats-panel-title {
  font-weight: bold;
  margin-bottom: 6px;
  cursor: grab;
  user-select: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.stats-panel .stats-panel-title:active { cursor: grabbing; }
.stats-panel.drag-over {
  outline: 2px dashed var(--accent);
  outline-offset: 2px;
}
.stats-panel.collapsed .stats-panel-title {
  margin-bottom: 0;
}
.stats-panel.collapsed .stats-panel-body {
  display: none;
}
.stats-panel-toggle {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-left: 8px;
  flex-shrink: 0;
  color: inherit;
  transition: transform 0.15s ease;
}
.stats-panel-toggle svg {
  width: 12px;
  height: 12px;
  display: block;
}
.stats-panel.collapsed .stats-panel-toggle {
  transform: rotate(-90deg);
}
.stats-panel label {
  display: block;
  margin: 4px 0;
  cursor: pointer;
}
.stats-panel .physics-control {
  margin: 10px 0;
}
.stats-panel .physics-control label {
  display: flex;
  justify-content: space-between;
  margin-bottom: 3px;
  cursor: default;
  font-weight: normal;
}
.stats-panel .physics-control input[type="range"] {
  width: 100%;
  box-sizing: border-box;
  accent-color: #5b9bd5;
  cursor: pointer;
}
.stats-panel .button-switch {
  display: block;
  width: 100%;
  text-align: center;
  margin: 10px 0 0 0;
  box-sizing: border-box;
}

.button-switch {
  display: inline-block;
  margin: 8px 4px;
  padding: 6px 16px;
  border-radius: 6px;
  border: 1px solid var(--btn-border);
  background: var(--btn-bg);
  color: var(--btn-text);
  cursor: pointer;
  font-size: 1em;
  font-family: inherit, Arial, sans-serif;
  transition: background 0.2s, color 0.2s, border-color 0.2s;
}
.button-switch:hover {
  background: var(--btn-bg-active);
}
.button-switch.active {
  background: var(--btn-bg-active);
  border-color: var(--btn-border);
  color: var(--btn-text);
}

/* Top panel */
.top-panel {
  position: fixed;
  top: 10px;
  left: 10px;
  right: 10px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 12px;
  z-index: 1200;
  padding: 8px 14px;
  border-radius: 8px;
  background: var(--topbar-bg);
  box-shadow: var(--panel-shadow);
  transition: var(--transition);
  pointer-events: none;
}
.top-panel .top-panel-left {
  pointer-events: auto;
  display: flex;
  align-items: center;
}
.top-panel .top-panel-center {
  pointer-events: auto;
  display: flex;
  justify-content: center;
  align-items: center;
}
.top-panel .top-panel-right {
  pointer-events: auto;
  display: flex;
  gap: 8px;
  align-items: center;
  justify-self: end;
}
.top-panel .button-switch { margin: 0; }
.top-panel-right #themeBtn {
  margin-left: 6px;
  padding-left: 14px;
  border-left: 1px solid var(--btn-border);
}

.search-wrap { position: relative; margin-bottom: 6px; }
.search-input {
  width: 100%;
  box-sizing: border-box;
  background: var(--btn-bg);
  color: var(--btn-text);
  border: 1px solid var(--btn-border);
  border-radius: 8px;
  padding: 9px 12px;
  font-size: 13px;
  outline: none;
  transition: var(--transition);
}
.search-input::placeholder { color: var(--text-muted); }
.search-input:focus { border-color: #5b9bd5; }
.top-search { width: 360px; max-width: 50vw; }
.top-search .search-input { width: 100%; }
.search-results {
  position: absolute;
  left: 0;
  right: 0;
  top: 100%;
  margin-top: 4px;
  background: var(--panel-bg);
  border: 1px solid var(--panel-border);
  border-radius: 8px;
  max-height: 200px;
  overflow-y: auto;
  z-index: 20;
  display: none;
  box-shadow: 0 4px 16px rgba(0,0,0,0.25);
}
.search-results.open { display: block; }
.search-item {
  padding: 8px 12px;
  font-size: 12px;
  color: var(--text);
  cursor: pointer;
  border-bottom: 1px solid var(--panel-border);
}
.search-item:last-child { border-bottom: none; }
.search-item:hover, .search-item.active { background: var(--btn-bg); }

/* Heatmap chart styles */
#heatmap-container svg {
  font: 10px sans-serif;
}
.axis path, .axis line {
  fill: none;
  stroke: var(--text);
  shape-rendering: crispEdges;
}
.background {
  fill: transparent;
}
line {
  stroke: var(--panel-border);
}
text {
  fill: var(--text);
  transition: none !important;
}
text.active {
  fill: red;
  font-weight: 700;
}
#heatmap-desc {
  position: fixed;
  bottom: 10px;
  left: 0;
  right: 0;
  text-align: center;
  color: var(--text);
  opacity: 0.55;
  font-size: 12px;
  z-index: 10;
  pointer-events: none;
}
.stats-panel select {
  width: 100%;
  box-sizing: border-box;
  background: var(--btn-bg);
  color: var(--btn-text);
  border: 1px solid var(--btn-border);
  border-radius: 6px;
  padding: 6px 8px;
  margin: 4px 0 8px;
  font-size: 13px;
}
</style>

  var matrix = [],
      nodes = data.nodes,
      n = nodes.length;

  nodes.forEach(function(node, i) {
    node.index = i;
    node.count = 0;
    matrix[i] = d3.range(n).map(function(j) { return {x: j, y: i, z: 0}; });
  });

  data.links.forEach(function(link) {
    matrix[link.source][link.target].z += link.value;
    matrix[link.target][link.source].z += link.value;
    matrix[link.source][link.source].z += link.value;
    matrix[link.target][link.target].z += link.value;
    nodes[link.source].count += link.value;
    nodes[link.target].count += link.value;
  });

  var orders = {
    name: d3.range(n).sort(function(a, b) { return d3.ascending(nodes[a].name, nodes[b].name); }),
    count: d3.range(n).sort(function(a, b) { return nodes[b].count - nodes[a].count; }),
    cluster: d3.range(n).sort(function(a, b) { return nodes[b].cluster - nodes[a].cluster; })
  };

  x.domain(orders.name);

  chartG.append("rect")
      .attr("class", "background")
      .attr("width", width)
      .attr("height", height);

  var row = chartG.selectAll(".row")
      .data(matrix)
    .enter().append("g")
      .attr("class", "row")
      .attr("transform", function(d, i) { return "translate(0," + x(i) + ")"; })
      .each(row);

  row.append("line")
      .attr("x2", width);

  row.append("text")
      .attr("x", -6)
      .attr("y", x.rangeBand() / 2)
      .attr("dy", ".32em")
      .attr("text-anchor", "end")
      .style("font-size", fontSize + "px")
      .text(function(d, i) { return nodes[i].name; });

  var column = chartG.selectAll(".column")
      .data(matrix)
    .enter().append("g")
      .attr("class", "column")
      .attr("transform", function(d, i) { return "translate(" + x(i) + ")rotate(-90)"; });

  column.append("line")
      .attr("x1", -width);

  column.append("text")
      .attr("x", 6)
      .attr("y", x.rangeBand() / 2)
      .attr("dy", ".32em")
      .attr("text-anchor", "start")
      .style("font-size", fontSize + "px")
      .text(function(d, i) { return nodes[i].name; });

  function row(row) {
    var cell = d3.select(this).selectAll(".cell")
        .data(row.filter(function(d) { return d.z; }))
        .enter().append("rect")
        .attr("class", "cell")
        .attr("x", function(d) { return x(d.x); })
        .attr("width", x.rangeBand())
        .attr("height", x.rangeBand())
        .style("fill-opacity", function(d) { return z(d.z); })
		.style("fill", function(d) {
			var sourceCluster = data.nodes[d.x].cluster;
			var targetCluster = data.nodes[d.y].cluster;
			return sourceCluster == targetCluster ? data.nodes[d.x].color : null;
			})
        .on("mouseover", mouseover)
        .on("mouseout", mouseout);
  }

  function mouseover(p) {
    d3.selectAll(".row text")
      .classed("active", function(d, i) { return i == p.y; })
      .style("font-size", function(d, i) { return i == p.y ? fontSizeHover + "px" : fontSize + "px"; })
      .style("opacity", function(d, i) { return i === p.y ? 1 : 0.3; })
      .style("fill", function(d, i) { return i == p.y ? strokeColor : null; });
    d3.selectAll(".column text")
      .classed("active", function(d, i) { return i == p.x; })
      .style("font-size", function(d, i) { return i == p.x ? fontSizeHover + "px" : fontSize + "px"; })
      .style("opacity", function(d, i) { return i === p.x ? 1 : 0.3; })
      .style("fill", function(d, i) { return i == p.x ? strokeColor : null; });
  }

  function mouseout() {
    d3.selectAll(".row text, .column text")
      .classed("active", false)
      .style("font-size", fontSize + "px")
      .style("fill", null)
      .style("opacity", 1);
  }

  function order(value) {
    x.domain(orders[value]);
    var t = chartG.transition().duration(1500);
    t.selectAll(".row")
      .delay(function(d, i) { return x(i) * 4; })
      .attr("transform", function(d, i) { return "translate(0," + x(i) + ")"; })
      .selectAll(".cell")
        .delay(function(d) { return x(d.x) * 4; })
        .attr("x", function(d) { return x(d.x); });
    t.selectAll(".column")
      .delay(function(d, i) { return x(i) * 4; })
      .attr("transform", function(d, i) { return "translate(" + x(i) + ")rotate(-90)"; });
  }

  // Order radios
  d3.selectAll('input[name="orderMode"]').on("change", function() {
    if (this.checked) order(this.value);
  });

  // Auto-order by cluster after a short delay (legacy behaviour)
  setTimeout(function() {
    order("cluster");
    var clusterRadio = document.querySelector('input[name="orderMode"][value="cluster"]');
    if (clusterRadio) clusterRadio.checked = true;
  }, 4000);

  // Font size controls
  var fsSlider = document.getElementById("fontSizeSlider");
  if (fsSlider) {
    fsSlider.addEventListener("input", function() {
      fontSize = +this.value;
      document.getElementById("fontSizeVal").textContent = fontSize;
      d3.selectAll(".row text, .column text").style("font-size", fontSize + "px");
      svgRoot.select("svg") || null;
      d3.select("#heatmap-container svg").style("font", fontSize + "px sans-serif");
    });
  }
  var fhSlider = document.getElementById("fontHoverSlider");
  if (fhSlider) {
    fhSlider.addEventListener("input", function() {
      fontSizeHover = +this.value;
      document.getElementById("fontHoverVal").textContent = fontSizeHover;
    });
  }
  var strokeInput = document.getElementById("strokeColor");
  if (strokeInput) {
    strokeInput.addEventListener("input", function() {
      strokeColor = this.value;
    });
  }

  // Theme
  var themeBtn = document.getElementById("themeBtn");
  if (themeBtn) {
    themeBtn.addEventListener("click", function() {
      document.body.classList.toggle("light");
      var isLight = document.body.classList.contains("light");
      themeBtn.textContent = isLight ? "☀" : "🌙";
      themeBtn.title = isLight ? "Theme: Light" : "Theme: Dark";
    });
  }

  // Reset zoom
  var resetBtn = document.getElementById("resetZoomBtn");
  if (resetBtn) {
    resetBtn.addEventListener("click", function() {
      zoomBehavior.scale(1).translate([0, 0]);
      chartG.attr("transform", "translate(" + baseTx + "," + baseTy + ")");
    });
  }

  // Search labels
  var searchInput = document.getElementById("searchInput");
  var searchResults = document.getElementById("searchResults");
  if (searchInput && searchResults) {
    var allNames = nodes.map(function(n) { return n.name; });
    searchInput.addEventListener("input", function() {
      var q = this.value.trim().toLowerCase();
      searchResults.innerHTML = "";
      if (!q) { searchResults.classList.remove("open"); return; }
      var matches = allNames.filter(function(n) { return n.toLowerCase().indexOf(q) >= 0; }).slice(0, 12);
      if (!matches.length) { searchResults.classList.remove("open"); return; }
      matches.forEach(function(name) {
        var item = document.createElement("div");
        item.className = "search-item";
        item.textContent = name;
        item.addEventListener("mousedown", function(e) {
          e.preventDefault();
          searchInput.value = name;
          searchResults.classList.remove("open");
          highlightLabel(name);
        });
        searchResults.appendChild(item);
      });
      searchResults.classList.add("open");
    });
    searchInput.addEventListener("blur", function() {
      setTimeout(function() { searchResults.classList.remove("open"); }, 150);
    });
  }

  function highlightLabel(name) {
    var idx = -1;
    nodes.forEach(function(n, i) { if (n.name === name) idx = i; });
    if (idx < 0) return;
    d3.selectAll(".row text")
      .classed("active", function(d, i) { return i === idx; })
      .style("font-size", function(d, i) { return i === idx ? fontSizeHover + "px" : fontSize + "px"; })
      .style("opacity", function(d, i) { return i === idx ? 1 : 0.25; })
      .style("fill", function(d, i) { return i === idx ? strokeColor : null; });
    d3.selectAll(".column text")
      .classed("active", function(d, i) { return i === idx; })
      .style("font-size", function(d, i) { return i === idx ? fontSizeHover + "px" : fontSize + "px"; })
      .style("opacity", function(d, i) { return i === idx ? 1 : 0.25; })
      .style("fill", function(d, i) { return i === idx ? strokeColor : null; });
    setTimeout(mouseout, 2500);
  }

  // Export data
  var exportBtn = document.getElementById("exportDataButton");
  if (exportBtn) {
    exportBtn.addEventListener("click", function() {
      try {
        var blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = "Heatmap - D3blocks_data.json";
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      } catch (err) {
        console.error(err);
        alert("Failed to export data.");
      }
    });
  }

  // Side panel chrome
  function positionSidePanels() {
    var panels = Array.prototype.slice.call(document.querySelectorAll(".stats-panel"));
    var topPanel = document.querySelector(".top-panel");
    var y = 10 + (topPanel ? topPanel.getBoundingClientRect().height + 8 : 0);
    panels.forEach(function(panel) {
      panel.style.top = y + "px";
      panel.style.left = "10px";
      panel.style.maxHeight = "calc(100vh - " + Math.round(y + 10) + "px)";
      y += panel.getBoundingClientRect().height + 8;
    });
  }
  window.addEventListener("DOMContentLoaded", positionSidePanels);
  window.addEventListener("resize", positionSidePanels);
  if (window.ResizeObserver) {
    var o = new ResizeObserver(positionSidePanels);
    document.querySelectorAll(".stats-panel").forEach(function(p) { o.observe(p); });
    document.querySelectorAll(".top-panel").forEach(function(p) { o.observe(p); });
  }
  document.querySelectorAll(".stats-panel-title").forEach(function(title) {
    title.addEventListener("click", function() {
      if (title.dataset.justDragged === "1") { title.dataset.justDragged = "0"; return; }
      var panel = title.parentElement;
      panel.classList.toggle("collapsed");
      positionSidePanels();
    });
  });
  (function setupPanelReordering() {
    document.querySelectorAll(".stats-panel").forEach(function(panel) {
      var title = panel.querySelector(".stats-panel-title");
      if (!title) return;
      title.addEventListener("dragstart", function(e) {
        e.dataTransfer.setData("text/plain", panel.id);
        e.dataTransfer.effectAllowed = "move";
      });
      title.addEventListener("dragend", function() {
        title.dataset.justDragged = "1";
        setTimeout(function() { title.dataset.justDragged = "0"; }, 0);
      });
      panel.addEventListener("dragover", function(e) {
        e.preventDefault();
        e.dataTransfer.dropEffect = "move";
        panel.classList.add("drag-over");
      });
      panel.addEventListener("dragleave", function() { panel.classList.remove("drag-over"); });
      panel.addEventListener("drop", function(e) {
        e.preventDefault();
        panel.classList.remove("drag-over");
        var draggedId = e.dataTransfer.getData("text/plain");
        if (!draggedId || draggedId === panel.id) return;
        var draggedEl = document.getElementById(draggedId);
        if (!draggedEl || !panel.parentNode) return;
        panel.parentNode.insertBefore(draggedEl, panel);
        positionSidePanels();
      });
    });
  })();
  requestAnimationFrame(positionSidePanels);
