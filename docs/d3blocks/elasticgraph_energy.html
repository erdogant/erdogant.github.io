Library     : d3blocks

Chart       : Elasticgraph (elastic force-directed network)
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>elasticgraph</title>
    <style>/* ── Theme variables ─────────────────────────────────────────────── */
:root {
  --bg: #1a1a2e;
  --panel-bg: rgba(26, 26, 46, 0.92);
  --panel-border: rgba(255, 255, 255, 0.15);
  --panel-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
  --dropdown-shadow: 0 4px 12px rgba(0, 0, 0, 0.5);
  --text: #eee;
  --text-muted: rgba(238, 238, 238, 0.6);
  --btn-bg: #2a2a4a;
  --btn-bg-active: #3d3d6d;
  --btn-border: #555;
  --btn-text: #eee;
  --tooltip-bg: rgba(26, 26, 46, 0.95);
  --tooltip-text: #fff;
  --transition: background 0.2s, color 0.2s, border-color 0.25s;
  --accent: #1ABC9C;
  --topbar-bg: rgba(26, 26, 46, 0.6);
  --search-hover: #1e4d42;
}
body.light {
  --bg: #f5f5f5;
  --panel-bg: rgba(255, 255, 255, 0.95);
  --panel-border: rgba(0, 0, 0, 0.1);
  --panel-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
  --dropdown-shadow: 0 4px 12px rgba(0, 0, 0, 0.15);
  --text: #222;
  --text-muted: rgba(34, 34, 34, 0.55);
  --btn-bg: #fff;
  --btn-bg-active: #eee;
  --btn-border: #ccc;
  --btn-text: #222;
  --tooltip-bg: rgba(255, 255, 255, 0.96);
  --tooltip-text: #1a1a1a;
  --accent: #16a085;
  --topbar-bg: rgba(255, 255, 255, 0.7);
  --search-hover: #e8f8f5;
}

/* ── Reset ───────────────────────────────────────────────────────── */
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  width: 100%;
  background: var(--bg);
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  font-size: 10px;
  overflow: hidden;
  transition: var(--transition);
  color: var(--text);
}

/* ── SVG / graph nodes ───────────────────────────────────────────── */
circle.node {
  fill: lightsteelblue;
  stroke: #555;
  stroke-width: 3px;
  cursor: move;
}
circle.node.dragging { cursor: grabbing; }
circle.leaf {
  stroke: #fff;
  stroke-width: 1.5px;
}
circle.link-expanded {
  stroke: #555;
  stroke-width: 3px;
  stroke-dasharray: 2px 4px;
}
circle.helper {
  stroke-width: 0;
  fill: #333;
  opacity: 0.6;
}
circle.center-of-mass {
  fill: white;
  stroke: red;
  stroke-width: 5px;
}
text.label {
  font-family: sans-serif;
  user-select: none;
  -webkit-user-select: none;
  fill: var(--text);
  transition: font-size 0.15s;
}
text.edge-label {
  font-family: sans-serif;
  user-select: none;
  -webkit-user-select: none;
  paint-order: stroke;
  stroke: #fff;
  stroke-width: 3px;
  stroke-linejoin: round;
  fill: var(--text);
}
body.light text.label,
body.light text.edge-label { fill: #222; }
body.light text.edge-label { stroke: #f5f5f5; }

svg.labels-hidden text.label,
svg.labels-hidden text.edge-label { display: none; }
svg.labels-force-hidden text.label,
svg.labels-force-hidden text.edge-label { display: none; }
svg.edge-labels-hidden text.edge-label { display: none; }

path.hull {
  fill: lightsteelblue;
  fill-opacity: 0.3;
}
path.hlink {
  stroke: #888;
  stroke-opacity: 0.5;
  fill: none;
  pointer-events: none;
}
body.light path.hlink { stroke: #444; }

line.link {
  stroke: red;
  stroke-opacity: 0.7;
  pointer-events: none;
}

/* ── Top panel ───────────────────────────────────────────────────── */
.top-panel {
  position: fixed;
  top: 10px;
  left: 10px;
  right: 10px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 12px;
  z-index: 1200;
  padding: 8px 14px;
  border-radius: 8px;
  background: var(--topbar-bg);
  box-shadow: var(--panel-shadow);
  transition: var(--transition);
  pointer-events: none;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}
.top-panel .top-panel-left {
  pointer-events: none;
  justify-self: start;
  width: max-content;
}
.top-panel .top-panel-left a {
  pointer-events: auto;
  display: inline-block;
  line-height: 0;
}
.top-panel .top-panel-center {
  pointer-events: auto;
  display: flex;
  justify-content: center;
  align-items: center;
}
.top-panel .top-panel-right {
  pointer-events: auto;
  display: flex;
  gap: 8px;
  align-items: center;
  justify-self: end;
}
.top-panel .button-switch { margin: 0; }

/* ── Side panels ─────────────────────────────────────────────────── */
.stats-panel {
  position: fixed;
  display: flex;
  flex-direction: column;
  resize: both;
  overflow: hidden;
  top: 60px;
  left: 10px;
  z-index: 1000;
  background: var(--panel-bg);
  color: var(--text);
  border-radius: 8px;
  padding: 10px 14px;
  box-shadow: var(--panel-shadow);
  font-size: 13px;
  width: 220px;
  min-width: 180px;
  max-width: min(600px, calc(100vw - 40px));
  border: 1px solid var(--panel-border);
  transition: background 0.25s, color 0.25s, border-color 0.25s;
  min-height: 40px;
  max-height: calc(100vh - 80px);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}
.stats-panel.collapsed { resize: none; }
.stats-panel-body {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
}
.stats-panel .stats-panel-title {
  font-weight: bold;
  margin-bottom: 6px;
  cursor: grab;
  user-select: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 13px;
}
.stats-panel .stats-panel-title:active { cursor: grabbing; }
.stats-panel.drag-over {
  outline: 2px dashed var(--accent);
  outline-offset: 2px;
}
.stats-panel.collapsed .stats-panel-title { margin-bottom: 0; }
.stats-panel.collapsed .stats-panel-body { display: none; }
.stats-panel-toggle {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-left: 8px;
  flex-shrink: 0;
  color: inherit;
  transition: transform 0.15s ease;
}
.stats-panel-toggle svg { width: 12px; height: 12px; display: block; }
.stats-panel.collapsed .stats-panel-toggle { transform: rotate(-90deg); }
.stats-panel label { display: block; margin: 4px 0; cursor: pointer; font-size: 13px; }
.stats-panel .physics-control { margin: 10px 0; }
.stats-panel .physics-control label {
  display: flex;
  justify-content: space-between;
  margin-bottom: 3px;
  cursor: default;
  font-weight: normal;
}
.stats-panel .physics-control input[type="range"] {
  width: 100%;
  box-sizing: border-box;
  accent-color: var(--accent);
}
.stats-panel .button-switch {
  display: block;
  width: 100%;
  text-align: center;
  margin: 10px 0 0 0;
  box-sizing: border-box;
}
.stats-panel hr {
  border: none;
  border-top: 1px solid var(--panel-border);
  margin: 8px 0;
}

/* ── Shared button style ─────────────────────────────────────────── */
.button-switch {
  display: inline-block;
  margin: 4px 0;
  padding: 6px 16px;
  border-radius: 6px;
  border: 1px solid var(--btn-border);
  background: var(--btn-bg);
  color: var(--btn-text);
  cursor: pointer;
  font-size: 1em;
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  transition: var(--transition);
}
.button-switch:hover { background: var(--btn-bg-active); }
.button-switch:active { background: var(--btn-bg-active); }
.button-switch.active {
  background: var(--btn-bg-active);
  border-color: var(--accent);
  color: var(--btn-text);
}
.button-switch:disabled { opacity: 0.45; cursor: default; }

/* ── Graph container (full viewport; panels float on top) ─────────── */
#graph-container {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  z-index: 0;
}
#graph-container svg {
  display: block;
  width: 100%;
  height: 100%;
}

/* ── Note text in panels ─────────────────────────────────────────── */
.panel-note {
  font-size: 11px;
  opacity: 0.65;
  margin-top: 6px;
  line-height: 1.4;
}</style>
</head>

    ui = nodeid(u);
    vi = nodeid(v);
    i = ui < vi ? ui + "|" + vi : vi + "|" + ui;
    l = lm[i] || (lm[i] = { source: u, target: v, size: 0, distance: 0 });
    if (ustate == 1) {
      ui = rui;
    }
    if (vstate == 1) {
      vi = rvi;
    }
    ix =
      ui < vi
        ? ui + "|" + vi + "|" + ustate + "|" + vstate
        : vi + "|" + ui + "|" + vstate + "|" + ustate;
    ix = ui < vi ? ui + "|" + vi : vi + "|" + ui;
    // link(u,v) ==> u -> lu -> rv -> v
    lu =
      nml[ix] ||
      (nml[ix] =
        data.helpers.left[ix] ||
        (data.helpers.left[ix] = {
          ref: u,
          id: "_lh_" + ix,
          size: -1,
          link_ref: l,
        }));
    rv =
      nmr[ix] ||
      (nmr[ix] =
        data.helpers.right[ix] ||
        (data.helpers.right[ix] = {
          ref: v,
          id: "_rh_" + ix,
          size: -1,
          link_ref: l,
        }));
    uimg = nmimg[ui];
    vimg = nmimg[vi];
    ll =
      lml[ix] ||
      (lml[ix] = {
        g_ref: l,
        ref: e,
        id: "l" + ix,
        source: uimg,
        target: lu,
        real_source: u,
        real_target: v,
        size: 0,
        distance: 0,
        left_seg: true,
      });
    l_ =
      lmm[ix] ||
      (lmm[ix] = {
        g_ref: l,
        ref: e,
        id: "m" + ix,
        source: lu,
        target: rv,
        real_source: u,
        real_target: v,
        size: 0,
        distance: 0,
        middle_seg: true,
      });
    lr =
      lmr[ix] ||
      (lmr[ix] = {
        g_ref: l,
        ref: e,
        id: "r" + ix,
        source: rv,
        target: vimg,
        real_source: u,
        real_target: v,
        size: 0,
        distance: 0,
        right_seg: true,
      });
    l.size += 1;
    ll.size += 1;
    l_.size += 1;
    lr.size += 1;

    // these are only useful for single-linked nodes, but we don't care; here we have everything we need at minimum cost.
    if (l.size == 1) {
      u.link_count++;
      v.link_count++;
      u.first_link = l;
      v.first_link = l;
      u.first_link_target = v;
      v.first_link_target = u;
    }
  }

  for (k in lm) {
    links.push(lm[k]);
  }
  for (k in lml) {
    helper_links.push(lml[k]);
  }
  for (k in lmm) {
    helper_links.push(lmm[k]);
    helper_render_links.push(lmm[k]);
  }
  for (k in lmr) {
    helper_links.push(lmr[k]);
  }
  for (k in nml) {
    helper_nodes.push(nml[k]);
  }
  for (k in nmr) {
    helper_nodes.push(nmr[k]);
  }

  return {
    nodes: nodes,
    links: links,
    helper_nodes: helper_nodes,
    helper_links: helper_links,
    helper_render_links: helper_render_links,
  };
}

function convexHulls(nodes, offset) {
  const hulls = {};

  // create point sets
  for (let k = 0; k < nodes.length; ++k) {
    const n = nodes[k];
    if (n.size) continue;
    const i = getGroup(n);
    const l = hulls[i] || (hulls[i] = []);
    l.push([n.x - offset, n.y - offset]);
    l.push([n.x - offset, n.y + offset]);
    l.push([n.x + offset, n.y - offset]);
    l.push([n.x + offset, n.y + offset]);
  }

  // create convex hulls
  const hullset = [];
  for (i in hulls) {
    hullset.push({ group: i, path: d3.geom.hull(hulls[i]) });
  }

  return hullset;
}

function drawCluster(d) {
  const curve = d3.svg.line().interpolate("cardinal-closed").tension(0.85);
  return curve(d.path); // 0.8
}

function d3graphscript(
  data,
  {
    width = 960,
    height = 600,
    dr = 4, // default point radius
    off = 15, // cluster hull offset
    expand = {}, // expanded clusters
    debug = 0, // 0: disable, 1: all, 2: only force2
    single_click_expand = true,
    sticky = true, // pin nodes in place after dragging; right-click to release
    label_zoom_threshold = 0.6, // below this zoom scale, labels are hidden
    charge = -1000, // node repulsion strength (negative = repel); groups repel at 2x this
    collision = 0.5, // link-distance/spacing multiplier; 0.5 = default spacing, higher = looser
  } = {}
) {
  let net,
    force,
    force2,
    hullg,
    hull,
    linkg,
    helper_linkg,
    link,
    hlink,
    nodeg,
    helper_nodeg,
    labelg,
    edge_labelg,
    node,
    hnode,
    label,
    edge_label;
  const pathgen = d3.svg.line().interpolate("basis");
  const fill = d3.scale.category20();

  // Mount into #graph-container if present, otherwise fall back to <body>.
  // This lets the host page position the SVG beside the side panels.
  const hostEl = document.getElementById("graph-container") || document.body;
  const body = d3.select(hostEl);

  // Fullscreen by default: use the container / viewport size.
  // Explicit positive width/height (from figsize) still work as a fixed size.
  function getContainerSize() {
    const w = hostEl.clientWidth  || window.innerWidth  || document.documentElement.clientWidth  || 900;
    const h = hostEl.clientHeight || window.innerHeight || document.documentElement.clientHeight || 600;
    return { w: Math.max(100, w), h: Math.max(100, h) };
  }
  let sz = getContainerSize();
  // 0 / null / missing → fill viewport; otherwise keep the explicit figsize
  if (!width  || width  <= 0) width  = sz.w;
  if (!height || height <= 0) height = sz.h;

  const vis = body.append("svg")
    .attr("width",  "100%")
    .attr("height", "100%")
    .style("display", "block");

  // Everything gets appended into this <g> instead of directly onto the svg, so the zoom
  // behaviour below can transform (scale/translate) the whole graph as one unit without
  // touching the underlying force-layout coordinates at all.
  const zoomRoot = vis.append("g");

  const zoomBehavior = d3.behavior.zoom().on("zoom", () => {
    zoomRoot.attr(
      "transform",
      "translate(" + d3.event.translate + ")scale(" + d3.event.scale + ")"
    );
    // hide labels once zoomed out past the threshold - a single class toggle is much
    // cheaper than touching every text element on every zoom/pan tick, and CSS handles
    // hiding all of them at once.
    var _lzt = (window._labelZoomThreshold !== undefined) ? window._labelZoomThreshold : label_zoom_threshold;
      vis.classed("labels-hidden", d3.event.scale < _lzt);
  });
  vis.call(zoomBehavior);

  // Resize: keep the force layout centred when the window is resized.
  window.addEventListener("resize", function() {
    sz = getContainerSize();
    width  = sz.w;
    height = sz.h;
    if (window._forceRef)  window._forceRef.size([width, height]).resume();
    if (window._force2Ref) window._force2Ref.size([width, height]).resume();
  });

  const defaultRadius = 4
  const scaling = dr / defaultRadius

  // d.size is INTERNAL bookkeeping (cluster member count for group nodes, unrelated to
  // the Python 'size' field). For real leaf nodes (d.size falsy) use the actual per-node
  // visual size (JSON field node_size, originally 'size' in node_properties).
  function nodeRadius(d) {
    return d.size > 0 ? d.size + dr : (d.node_size || 1) + dr;
  }

  //   function updateWindow() {
  //     const w =
  //       window.innerWidth ||
  //       document.documentElement.clientWidth ||
  //       document.body.clientWidth;
  //     const h =
  //       window.innerHeight ||
  //       document.documentElement.clientHeight ||
  //       document.body.clientHeight;
  //     debugger;
  //     vis.attr("width", w).attr("height", h);
  //   }

  //   window.onresize = updateWindow;

  // these functions call init(); by declaring them here,
  // they don't have the old init() as a closure any more.
  // This should save us some memory and cycles when using
  // this in a long-running setting.

  function on_node_click(d) {
    if (debug == 1)
      console.log("node click", d, arguments, this, expand[d.group]);
    // clicking on 'path helper nodes' shouln't expand/collapse the group node:
    if (d.size < 0) return;
    cycleState(d);
    init();
  }

  function cycleState(d) {
    const g = d.group;
    let s = expand[g] || 0;

    var _sce = (window._singleClickExpand !== undefined) ? window._singleClickExpand : single_click_expand;
    if (_sce && s != 2) return (expand[g] = 2);

    // it's no use 'expanding the intergroup links only' for nodes which only have 1 outside link for real:
    if (d.ig_link_count < 2) {
      s = s ? 0 : 2;
    } else {
      s++;
      s %= 3;
    }
    return (expand[g] = s);
  }

  // ---- STICKY DRAGGING ----
  // IMPORTANT: we do NOT build this on top of force.drag(). force.drag() registers its
  // "dragstart"/"drag"/"dragend" listeners WITHOUT a namespace, so chaining our own .on()
  // calls on that same object silently REPLACES d3's internal handlers instead of adding
  // to them. Those internal handlers matter: dragstart sets d.fixed |= 2 (protects the node
  // from gravity/charge/recentering forces while it's being dragged) and drag continuously
  // sets d.px/d.py + force.resume() (the actual elastic tracking). Losing them is what made
  // a dragged node "jump" around: the simulation kept fighting its position mid-drag.
  //
  // So instead we build a fully independent d3.behavior.drag() that replicates that same
  // protection, and add our own permanent-pin behaviour on top of it. This never touches
  // force.drag()'s internals, so nothing gets silently overwritten.
  //
  // Sticky mode: dragend pins the node (d.fixed stays truthy after release) with a dashed
  //   stroke as a visual cue. Right-click a pinned node to release it back into the simulation.
  // Non-sticky: behaves like plain d3 dragging (released back into the simulation on mouseup).

  function dragstarted(d) {
    d3.event.sourceEvent.stopPropagation();
    d3.select(this).classed("dragging", true);
    d.fixed |= 2; // protect from simulation forces for the duration of the drag
  }

  function dragged(d) {
    d.px = d3.event.x;
    d.py = d3.event.y;
    force.resume();
  }

  function dragended(d) {
    d3.select(this).classed("dragging", false);
    var _effectiveSticky = (window._stickyOverride !== undefined) ? window._stickyOverride : sticky;
    if (_effectiveSticky) {
      d.fixed = 1; // permanently pinned
      d3.select(this).style("stroke-dasharray", "4,2");
    } else {
      d.fixed &= 1; // release back into the simulation unless already pinned
    }
  }

  function releaseNode(d) {
    d3.event.preventDefault();
    d.fixed = 0;
    d3.select(this).style("stroke-dasharray", null);
    force.resume();
  }

  // ---- END STICKY DRAGGING ----

  function parseJson(data) {
    for (let i = 0; i < data.links.length; ++i) {
      o = data.links[i];
      o.source = data.nodes[o.source];
      o.target = data.nodes[o.target];
    }
    // prepare data struct to also carry our 'path helper nodes':
    data.helpers = { left: {}, right: {} };

    hullg = zoomRoot.append("g");
    if (debug) {
      linkg = zoomRoot.append("g");
      helper_nodeg = zoomRoot.append("g");
    }
    helper_linkg = zoomRoot.append("g");
    edge_labelg = zoomRoot.append("g");
    nodeg = zoomRoot.append("g");
    labelg = zoomRoot.append("g");
    if (debug == 1) {
      node = vis
        .append("g")
        .append("circle")
        .attr("class", "center-of-mass")
        .attr("r", 10);
    }

    init();

    vis.attr("opacity", 1e-6).transition().duration(1000).attr("opacity", 1);
  }

  function init() {
    if (force) force.stop();
    net = network(data, net, expand);

    // Charge helper: density-aware so large graphs do not pin nodes to the edges.
    // Tuned for ~50 nodes; denser graphs get weaker per-node repulsion (sqrt scale).
    function chargeFor(d) {
      const n = (net && net.nodes && net.nodes.length) ? net.nodes.length : 50;
      const densityScale = Math.sqrt(50 / Math.max(10, n));
      const base = charge * scaling * densityScale;
      // Group placeholders repel a bit stronger so clusters stay separated
      if (d.size > 0) return base * 2;
      return base;
    }

    force = d3.layout
      .force()
      .nodes(net.nodes)
      .links(net.links)
      .size([getContainerSize().w, getContainerSize().h])
      .linkDistance((l) => {
        const n1 = l.source;
        const n2 = l.target;
        const _col = (window._collisionOverride !== undefined) ? window._collisionOverride : collision;
        const collisionFactor = _col / 0.5; // 0.5 is the baseline/default

        const inSameGroup = n1.group == n2.group;
        if (inSameGroup) {
          // In the same group
          return 2 * scaling * collisionFactor;
        } else {
          // Not in the same group
          return 40 * scaling * collisionFactor;
        }
      })
      // Gravity kept moderate so charge/cohesion can form clusters instead of
      // slamming everything to the center or the outer rim of the viewport.
      .gravity(0.35)
      .charge(chargeFor)
      .friction(0.75)
      .start();

    /*
        And here's the crazy idea for allowing AND rendering multiple links between 2 nodes, etc., as the initial attempt
        to include the 'helper' nodes in the basic 'force' failed dramatically from a visual PoV: we 'overlay' the basic
        nodes+links force with a SECOND force layout which 'augments' the original force layout by having it 'layout' all
        the helper nodes (with their links) between the 'fixed' REAL nodes, which are laid out by the original force.
        
        This way, we also have the freedom to apply a completely different force field setup to the helpers (no gravity
        as it doesn't make sense for helpers, different charge values, etc.).
        */
    force2 = d3.layout
      .force()
      .nodes(net.helper_nodes)
      .links(net.helper_links)
      .size([getContainerSize().w, getContainerSize().h])
      .linkDistance(function (l) {
        var lr = l.g_ref;
        if (lr.source.size > 0 || lr.target.size > 0) return 20;
        return 1;
      })
      .gravity(0.0) // just a tad of gravidy to help keep those curvy buttocks decent
      .charge(function (d) {
        // helper nodes have a medium-to-high charge, depending on the number of links the related force link represents.
        // Hence bundles of links fro A->B will have helper nodes with huge charges: better spreading of the link paths.
        //
        // Unless we're looking at helpers for links between 'real nodes', NOT GROUPS: in that case we want to keep
        // the lines are straight as posssible as there would only be one relation for A->B anyway, so we lower the charge
        // for such nodes and helpers.
        if (d.fixed) return -10;
        var l = d.link_ref;
        if (l.source.size > 0 || l.target.size > 0) return -30;
        return -1;
      })
      .friction(0.95)
      .start()
      .stop(); // and immediately stop! force.tick will drive this one every tick!

    // Expose for panel controls / resize handler
    window._forceRef  = force;
    window._force2Ref = force2;

    // If the container was not laid out yet (0×0 / very small), re-measure next frame
    // so the force field matches the real viewport and nodes do not settle on a wrong edge.
    requestAnimationFrame(function() {
      const s2 = getContainerSize();
      if (s2.w > 50 && s2.h > 50) {
        width = s2.w;
        height = s2.h;
        if (force)  force.size([width, height]);
        if (force2) force2.size([width, height]);
      }
    });

    hullg.selectAll("path.hull").remove();
    hull = hullg
      .selectAll("path.hull")
      .data(convexHulls(net.nodes, off))
      .enter()
      .append("path")
      .attr("class", "hull")
      .attr("d", drawCluster)
      .style("fill", (d) => fill(d.group))
      .on("click", on_node_click);

    if (debug == 1) {
      link = linkg.selectAll("line.link").data(net.links, linkid);
      link.exit().remove();
      link
        .enter()
        .append("line")
        .attr("class", "link")
        .attr("x1", (d) => d.source.x)
        .attr("y1", (d) => d.source.y)
        .attr("x2", (d) => d.target.x)
        .attr("y2", (d) => d.target.y);
      // both existing and enter()ed links may have changed stroke width due to expand state change somewhere:
      link.style("stroke-width", (d) => d.size || 1);
    }

    hlink = helper_linkg
      .selectAll("path.hlink")
      .data(net.helper_render_links, (d) => d.id);
    hlink.exit().remove();
    hlink.enter().append("path").attr("class", "hlink");
    // both existing and enter()ed links may have changed stroke width due to expand state change somewhere:
    hlink.style("stroke-width", (d) => d.size || 1);

    // edge-weight labels: one per rendered edge curve (net.helper_render_links has exactly
    // one entry per visible hlink path already, so we reuse it here with the same id key).
    // d.ref is the original edge/link data object (weight, tooltip, label, label_color, ...).
    edge_label = edge_labelg
      .selectAll("text.edge-label")
      .data(net.helper_render_links, (d) => d.id);
    edge_label.exit().remove();
    edge_label
      .enter()
      .append("text")
      .attr("class", "edge-label")
      .attr("text-anchor", "middle")
      .attr("pointer-events", "none");
    // (re)apply to both newly entered and pre-existing labels, same pattern as hlink above
    edge_label
      .style("fill", (d) => d.ref.label_color || getComputedStyle(document.body).getPropertyValue("--text-muted").trim() || "#aaa")
      .style(
        "font-size",
        (d) => (d.ref.label_fontsize ? d.ref.label_fontsize + "px" : "8px")
      )
      .text((d) => d.ref.label || "");
      //.text((d) => d.ref.label || d.ref.tooltip || d.ref.weight || "");

    if (debug) {
      hnode = helper_nodeg
        .selectAll("circle.node")
        .data(net.helper_nodes, (d) => d.id);
      hnode.exit().remove();
      hnode
        .enter()
        .append("circle")
        // if (d.size) -- d.size > 0 when d is a group node.
        // d.size < 0 when d is a 'path helper node'.
        .attr(
          "class",
          (d) => "node" + (d.size > 0 ? "" : d.size < 0 ? " helper" : " leaf")
        )
        .attr("r", (d) => (d.size < 0 ? 2 : nodeRadius(d)))
        .attr("cx", (d) => d.x)
        .attr("cy", (d) => d.y)
        .style("fill", (d) => fill(d.group));
    }

    node = nodeg.selectAll("circle.node").data(net.nodes, nodeid);
    node.exit().remove();
    const nodeEnter = node
      .enter()
      .append("circle")
      // if (d.size) -- d.size > 0 when d is a group node.
      // d.size < 0 when d is a 'path helper node'.
      .attr("class", (d) => (
          "node" +
          (d.size > 0 ? (d.expansion ? " link-expanded" : "") : " leaf")
        ))
      .attr("r", (d) => nodeRadius(d))
      .attr("cx", (d) => d.x)
      .attr("cy", (d) => d.y)
      .style("fill", (d) => fill(d.group))
      .style("opacity", (d) => d.node_opacity)
      .style("stroke", (d) => d.node_color_edge)
      .style("stroke-width", (d) => d.node_size_edge)
      .on("click", on_node_click);

    // native browser tooltip on hover, using the 'tooltip' field (falls back to label/name)
    nodeEnter
      .append("title")
      .text((d) => d.node_tooltip || d.node_name || d.name);

    // Sticky-aware drag: a fully independent d3.behavior.drag(), NOT force.drag() — see the
    // comment above dragstarted() for why reusing force.drag() breaks the simulation.
    const drag = d3.behavior
      .drag()
      .origin((d) => d)
      .on("dragstart", dragstarted)
      .on("drag", dragged)
      .on("dragend", dragended);

    node
      // replicate the hover protection d3's own force.drag() normally provides, so a fast
      // charge/repulsion animation doesn't make the node hard to grab before the drag starts
      .on("mouseover.sticky", (d) => { d.fixed |= 4; })
      .on("mouseout.sticky", (d) => { d.fixed &= 3; })
      .call(drag);

    if (sticky) {
      // right-click a pinned node to release it back into the simulation
      node.on("contextmenu", releaseNode);
    }

    // node labels: one text element per node, positioned just below the circle
    label = labelg.selectAll("text.label").data(net.nodes, nodeid);
    label.exit().remove();
    label
      .enter()
      .append("text")
      .attr("class", "label")
      .attr("text-anchor", "middle")
      .attr("pointer-events", "none");
    // (re)apply styling to both newly entered and pre-existing labels, same as hlink above
    label
      .style("fill", (d) => d.node_fontcolor || getComputedStyle(document.body).getPropertyValue("--text").trim() || "#eee")
      .style("font-size", (d) => { var sz = window._labelSizeOverride || (d.node_fontsize ? d.node_fontsize : 12); return sz + "px"; })
      .text((d) => d.node_name || d.name || "group " + d.group);

    var drag_in_progress = false;
    var change_squared;

    // CPU load redux for the fix, part 3: jumpstart the annealing process again when the user moves the mouse outside the node,
    // when we believe the drag is still going on; even when it isn't anymore, but D3 doesn't inform us about that!
    node.on("mouseout.ger_fix", function (d) {
      if (debug == 1)
        console.log(
          "mouseout.ger_fix",
          this,
          arguments,
          d.fixed,
          drag_in_progress
        );
      if (drag_in_progress) {
        force.resume();
      }
    });

    var resume_threshold = 0.05;

    force.on("tick", function (e) {
      /*
            Force all nodes with only one link to point outwards.
        
            To do this, we first calculate the center mass (okay, we wing it, we fake node 'weight'),
            then see whether the target node for links from single-link nodes is closer to the
            center-of-mass than us, and if it isn't, we push the node outwards.
            */
      var center = { x: 0, y: 0, weight: 0 },
        singles = [],
        groupCentroids = {},
        size,
        c,
        mx,
        my,
        dx,
        dy,
        alpha;

      drag_in_progress = false;
      net.nodes.forEach((n) => {
        var w = Math.max(1, n.size || 0, n.weight || 0);

        center.x += w * n.x;
        center.y += w * n.y;
        center.weight += w;

        if (n.fixed & 2) {
          drag_in_progress = true;
        }

        // accumulate each cluster's live centroid from its currently-visible (expanded)
        // members, used below to gently pull members back toward their own cluster.
        if (!(n.size > 0)) {
          const gc = groupCentroids[n.group] || (groupCentroids[n.group] = { x: 0, y: 0, count: 0 });
          gc.x += n.x;
          gc.y += n.y;
          gc.count++;
        }

        // Only collapsed GROUP placeholders get pushed outward (their apparent original
        // intent). Applying this per individual leaf member (once expanded) compounds
        // across every member of a cluster - each pushing the same direction, every tick,
        // uncapped - dragging the whole cluster to the canvas boundary where it gets
        // clamped and pinned as a thin strip. Cohesion + normal link/charge forces are
        // enough to hold an expanded cluster together without this redundant extra push.
        if (n.size > 0 && n.ig_link_count > 0 && n.link_count < 4) singles.push(n);
      });

      // cluster cohesion: nudge every real node a small step toward its own cluster's
      // current centroid. linkDistance already pulls DIRECTLY-linked same-group nodes
      // together, but members with no direct edge to another member of their own cluster
      // had nothing pulling them together at all - only charge pushing them apart and
      // gravity pulling everyone toward the same global center - so they'd drift and
      // interleave with unrelated clusters. This fixes that gap without touching charge.
      const cohesionStrength = 0.15;
      net.nodes.forEach((n) => {
        if (n.size > 0) return;
        const gc = groupCentroids[n.group];
        if (!gc || gc.count < 2) return;
        const cx = gc.x / gc.count;
        const cy = gc.y / gc.count;
        n.x += (cx - n.x) * cohesionStrength * e.alpha;
        n.y += (cy - n.y) * cohesionStrength * e.alpha;
      });

      size = force.size();

      mx = size[0] / 2;
      my = size[1] / 2;

      singles.forEach((n) => {
        var l = n.first_link,
          k,
          alpha,
          power,
          dx,
          dy,
          n_is_group = n.size || 0,
          w = Math.max(1, n.size || 0, n.weight || 0);

        // haven't decided what to do for unconnected nodes, yet...
        if (!l) return;

        // apply amplification of the 'original' alpha:
        // 1.0 for singles and double-connected nodes, close to 0 for highly connected nodes, rapidly decreasing.
        // Use this as we want to give those 'non-singles' a little bit of the same 'push out' treatment.
        // Reduce effect for 'real nodes' which are singles: they need much less encouragement!
        power = Math.max(
          2,
          n_is_group ? n.link_count : n.group_data.link_count
        );
        power = 2 / power;

        alpha = e.alpha * power;

        // undo/revert gravity forces (or as near as we can get, here)
        //
        // revert for truely single nodes, revert just a wee little bit for dual linked nodes,
        // only reduce ever so slighty for nodes with few links (~ 3) that made it into this
        // 'singles' selection
        if ((k = alpha * force.gravity() * (0.8 + power))) {
          dx = (mx - n.x) * k;
          dy = (my - n.y) * k;
          n.x -= dx;
          n.y -= dy;

          center.x -= dx * w;
          center.y -= dy * w;
        }
      });

      // move the entire graph so that its center of mass sits at the center, period.
      center.x /= center.weight;
      center.y /= center.weight;

      if (debug == 1) {
        c = vis
          .selectAll("circle.center-of-mass")
          .attr("cx", center.x)
          .attr("cy", center.y);
      }

      dx = mx - center.x;
      dy = my - center.y;

      alpha = e.alpha * 5;
      dx *= alpha;
      dy *= alpha;

      net.nodes.forEach((n) => {
        n.x += dx;
        n.y += dy;
      });

      change_squared = 0;

      // fixup .px/.py so drag behaviour and annealing get the correct values, as
      // force.tick() would expect .px and .py to be the .x and .y of yesterday.
      net.nodes.forEach((n) => {
        // restrain all nodes to window area
        var k,
          dx,
          dy,
          r = nodeRadius(n) + 2; /* styled border outer thickness and a bit */

        dx = 0;
        if (n.x < r) dx = r - n.x;
        else if (n.x > size[0] - r) dx = size[0] - r - n.x;

        dy = 0;
        if (n.y < r) dy = r - n.y;
        else if (n.y > size[1] - r) dy = size[1] - r - n.y;

        k = 1.2;

        n.x += dx * k;
        n.y += dy * k;
        // restraining completed.......................
        // fixes 'elusive' node behaviour when hovering with the mouse (related to force.drag)
        if (n.fixed) {
          // 'elusive behaviour' ~ move mouse near node and node would take off, i.e. act as an elusive creature.
          n.x = n.px;
          n.y = n.py;
        }
        n.px = n.x;
        n.py = n.y;

        // plus copy for faster stop check
        change_squared += (n.qx - n.x) * (n.qx - n.x);
        change_squared += (n.qy - n.y) * (n.qy - n.y);
        n.qx = n.x;
        n.qy = n.y;
      });

      // kick the force2 to also do a bit of annealing alongside:
      // to make it do something, we need to surround it alpha-tweaking stuff, though.
      force2.resume();
      force2.tick();
      force2.stop();

      // fast stop + the drag fix, part 2:
      if (change_squared < 0.005) {
        if (debug == 1) console.log("fast stop: CPU load redux");
        force.stop();
        // fix part 4: monitor D3 resetting the drag marker:
        if (drag_in_progress) {
          if (debug == 1)
            console.log("START monitor drag in progress", drag_in_progress);
          d3.timer(function () {
            drag_in_progress = false;
            net.nodes.forEach((n) => {
              if (n.fixed & 2) {
                drag_in_progress = true;
              }
            });
            force.resume();
            if (debug == 1)
              console.log(
                "monitor drag in progress: drag ENDED",
                drag_in_progress
              );
            // Quit monitoring as soon as we noticed the drag ENDED.
            // Note: we continue to monitor at +500ms intervals beyond the last tick
            //       as this timer function ALWAYS kickstarts the force layout again
            //       through force.resume().
            //       d3.timer() API only accepts an initial delay; we can't set this
            //       thing to scan, say, every 500msecs until the drag is done,
            //       so we do it that way, via the revived force.tick process.
            return true;
          }, 500);
        }
      } else if (
        change_squared > net.nodes.length * 5 &&
        e.alpha < resume_threshold
      ) {
        // jolt the alpha (and the visual) when there's still a lot of change when we hit the alpha threshold.
        force.alpha(Math.min(0.1, (e.alpha *= 2))); //force.resume(), but now with decreasing alpha starting value so the jolts don't get so big.

        // And 'dampen out' the trigger point, so it becomes harder and harder to trigger the threshold.
        // This is done to cope with those instable (forever rotating, etc.) layouts...
        resume_threshold *= 0.9;
      }

      //--------------------------------------------------------------------

      if (!hull.empty()) {
        hull.data(convexHulls(net.nodes, off)).attr("d", drawCluster);
      }

      if (debug == 1) {
        link
          .attr("x1", (d) => d.source.x)
          .attr("y1", (d) => d.source.y)
          .attr("x2", (d) => d.target.x)
          .attr("y2", (d) => d.target.y);
      }

      node.attr("cx", (d) => d.x).attr("cy", (d) => d.y);

      label
        .attr("x", (d) => d.x)
        .attr("y", (d) => d.y + (d.size > 0 ? d.size + dr : dr + 1) + 10);
    });

    force2.on("tick", function () {
      /*
                Update all 'real'=fixed nodes.
            */
      net.helper_nodes.forEach((n) => {
        var o;
        if (n.fixed) {
          o = n.ref;
          n.px = n.x = o.x;
          n.py = n.y = o.y;
        }
      });
      net.helper_links.forEach((l) => {
        var o = l.g_ref;
        l.distance = o.distance;
      });

      // NOTE: force2 is fully driven by force(1), but still there's need for 'fast stop' handling in here
      //       as our force2 may be more 'joyous' in animating the links that force is animating the nodes
      //       themselves. Hence we also take the delta movement of the helper nodes into account!
      net.helper_nodes.forEach((n) => {
        // skip the 'fixed' buggers: those are already accounted for in force.tick!
        if (n.fixed) return;

        // plus copy for faster stop check
        change_squared += (n.qx - n.x) * (n.qx - n.x);
        change_squared += (n.qy - n.y) * (n.qy - n.y);
        n.qx = n.x;
        n.qy = n.y;
      });

      //--------------------------------------------------------------------

      hlink.attr("d", (d) =>
        pathgen([
          [d.real_source.x, d.real_source.y],
          [d.source.x, d.source.y],
          [d.target.x, d.target.y],
          [d.real_target.x, d.real_target.y],
        ])
      );

      edge_label
        .attr("x", (d) => (d.real_source.x + d.real_target.x) / 2)
        .attr("y", (d) => (d.real_source.y + d.real_target.y) / 2);

      if (debug) {
        hnode.attr("cx", (d) => d.x).attr("cy", (d) => d.y);
      }
    });
  }

  parseJson(data);

  // Expose internals for panel controls (Physics sliders, unpin, reset-zoom).
  window._forceRef = force;
  window._force2Ref = force2;
  window._zoomBehavior = zoomBehavior;

  // ── Live control API exposed for the side panels ──────────────────────────
  // Called by the physics sliders in the HTML template.
  window._applyCharge = function(v) {
    // Keep the same charge model as init (per-node, density-scaled, groups 2x)
    charge = -Math.abs(v);
    const n = (net && net.nodes && net.nodes.length) ? net.nodes.length : 50;
    const densityScale = Math.sqrt(50 / Math.max(10, n));
    force.charge(function(d) {
      const base = charge * scaling * densityScale;
      if (d.size > 0) return base * 2;
      return base;
    }).start();
  };
  window._applyCollision = function() {
    // collision is used inside linkDistance() — reheat the sim without resetting positions
    force.resume();
  };
  // Called by label-size slider: updates all text.label and text.edge-label live.
  window._applyLabelSize = function(px) {
    window._labelSizeOverride = px;
    d3.selectAll('#graph-container text.label').style('font-size', px + 'px');
    d3.selectAll('#graph-container text.edge-label').style('font-size', Math.max(7, px - 2) + 'px');
  };
  // Hull offset requires a full re-init — expose so the slider can call restart.
  window._applyHullOffset = function(v) {
    off = v;
    init(net);
  };
  // Node size: update all node circle radii live.
  window._applyNodeSize = function(r) {
    window._nodeSizeOverride = r;
    d3.selectAll('#graph-container circle.node').attr('r', function(d) {
      return d.size > 0 ? r * Math.sqrt(d.size) + r : r;
    });
    d3.selectAll('#graph-container circle.leaf').attr('r', r);
  };

  return { force, force2, zoomBehavior };
}</script>

/* ── Panel infrastructure ───────────────────────────────────────── */
(function () {
  var PANEL_ORDER = ['exportPanel', 'physicsPanel', 'displayPanel'];

  function positionSidePanels() {
    var bar = document.querySelector('.top-panel');
    // Graph stays full-viewport; side panels float over it (same as maps/scatter)
    var gc = document.getElementById('graph-container');
    if (gc) {
      gc.style.left = '0';
      gc.style.right = '0';
      gc.style.top = '0';
      gc.style.bottom = '0';
    }

    var y = bar ? bar.getBoundingClientRect().bottom + 8 : 60;
    PANEL_ORDER.forEach(function (id) {
      var p = document.getElementById(id);
      if (!p) return;
      p.style.top = y + 'px';
      p.style.maxHeight = Math.max(80, window.innerHeight - y - 12) + 'px';
      y += p.getBoundingClientRect().height + 10;
    });
  }

  window.addEventListener('resize', positionSidePanels);
  window.addEventListener('load',   positionSidePanels);
  requestAnimationFrame(positionSidePanels);
  if (typeof ResizeObserver !== 'undefined') {
    var bar = document.querySelector('.top-panel');
    if (bar) new ResizeObserver(positionSidePanels).observe(bar);
    PANEL_ORDER.forEach(function (id) {
      var el = document.getElementById(id);
      if (el) new ResizeObserver(positionSidePanels).observe(el);
    });
  }

  // Collapse toggle
  PANEL_ORDER.forEach(function (id) {
    var panel = document.getElementById(id); if (!panel) return;
    var title = panel.querySelector('.stats-panel-title'); if (!title) return;
    title.addEventListener('click', function () {
      if (title.dataset.justDragged === '1') { title.dataset.justDragged = '0'; return; }
      var collapsing = !panel.classList.contains('collapsed');
      if (collapsing && panel.style.height) panel.dataset.expandedHeight = panel.style.height;
      else if (panel.dataset.expandedHeight) panel.style.height = panel.dataset.expandedHeight;
      panel.classList.toggle('collapsed');
      setTimeout(positionSidePanels, 0);
    });
  });

  // Drag-reorder
  PANEL_ORDER.forEach(function (panelId) {
    var panel = document.getElementById(panelId); if (!panel) return;
    var title = panel.querySelector('.stats-panel-title'); if (!title) return;
    title.addEventListener('dragstart', function (e) {
      e.dataTransfer.setData('text/plain', panelId);
      e.dataTransfer.effectAllowed = 'move';
    });
    title.addEventListener('dragend', function () {
      title.dataset.justDragged = '1';
      setTimeout(function () { title.dataset.justDragged = '0'; }, 0);
    });
    panel.addEventListener('dragover', function (e) { e.preventDefault(); panel.classList.add('drag-over'); });
    panel.addEventListener('dragleave', function () { panel.classList.remove('drag-over'); });
    panel.addEventListener('drop', function (e) {
      e.preventDefault(); panel.classList.remove('drag-over');
      var from = PANEL_ORDER.indexOf(e.dataTransfer.getData('text/plain'));
      var to   = PANEL_ORDER.indexOf(panelId);
      if (from < 0 || to < 0 || from === to) return;
      var item = PANEL_ORDER.splice(from, 1)[0];
      PANEL_ORDER.splice(to, 0, item);
      positionSidePanels();
    });
  });

  // Theme toggle
  document.getElementById('themeBtn').addEventListener('click', function () {
    document.body.classList.toggle('light');
    var light = document.body.classList.contains('light');
    this.textContent = light ? '☀' : '🌙';
    // Refresh label colours (they read --text from body style at render time)
    if (window._applyLabelSize) window._applyLabelSize(window._labelSizeOverride || 12);
  });
})();

/* ── Physics sliders ────────────────────────────────────────────── */
(function () {
  function sl(id, valId, fn) {
    var el = document.getElementById(id), vl = document.getElementById(valId);
    if (!el) return;
    el.addEventListener('input', function () {
      if (vl) vl.textContent = parseFloat(el.value).toFixed(el.step < 1 ? 1 : 0);
      fn(parseFloat(el.value));
    });
  }

  // Charge — live: force.charge(-v).start()
  sl('chargeSlider', 'chargeVal', function (v) {
    if (window._applyCharge) window._applyCharge(v);
  });

  // Collision — update override then reheat sim
  sl('collisionSlider', 'collisionVal', function (v) {
    window._collisionOverride = v;
    if (window._applyCollision) window._applyCollision();
  });

  // Hull offset — full redraw via _applyHullOffset
  sl('hullSlider', 'hullVal', function (v) {
    if (window._applyHullOffset) window._applyHullOffset(v);
  });
})();

/* ── Display controls ───────────────────────────────────────────── */
(function () {
  function sl(id, valId, fn) {
    var el = document.getElementById(id), vl = document.getElementById(valId);
    if (!el) return;
    el.addEventListener('input', function () {
      if (vl) vl.textContent = parseFloat(el.value).toFixed(el.step < 1 ? 2 : 0);
      fn(parseFloat(el.value));
    });
  }
  function cb(id, fn) {
    var el = document.getElementById(id);
    if (el) el.addEventListener('change', function () { fn(el.checked); });
  }

  // Label size (px)
  sl('labelSizeSlider', 'labelSizeVal', function (v) {
    if (window._applyLabelSize) window._applyLabelSize(v);
  });

  // Node size (dr / point_radius)
  sl('nodeSizeSlider', 'nodeSizeVal', function (v) {
    if (window._applyNodeSize) window._applyNodeSize(v);
  });

  // Label zoom threshold
  sl('labelZoomSlider', 'labelZoomVal', function (v) {
    window._labelZoomThreshold = v;
  });

  // Show/hide labels
  cb('toggleLabels', function (on) {
    var svg = document.querySelector('#graph-container svg');
    if (svg) svg.classList.toggle('labels-force-hidden', !on);
  });

  // Show/hide edge labels
  cb('toggleEdgeLabels', function (on) {
    var svg = document.querySelector('#graph-container svg');
    if (svg) svg.classList.toggle('edge-labels-hidden', !on);
  });

  // Sticky — dragended() reads window._stickyOverride live
  cb('toggleSticky', function (on) { window._stickyOverride = on; });

  // Single-click expand — toggle the behaviour flag read by the click handler
  cb('toggleSingleClick', function (on) { window._singleClickExpand = on; });

  // Reset zoom
  var resetBtn = document.getElementById('resetZoomBtn');
  if (resetBtn) resetBtn.addEventListener('click', function () {
    var z = window._zoomBehavior, svg = d3.select('#graph-container svg');
    if (z && svg) { z.translate([0,0]).scale(1); svg.transition().duration(400).call(z.event); }
  });

  // Unpin all
  var unpinBtn = document.getElementById('unpinAllBtn');
  if (unpinBtn) unpinBtn.addEventListener('click', function () {
    d3.selectAll('#graph-container circle.node').each(function (d) {
      if (d) d.fixed = 0;
      d3.select(this).style('stroke-dasharray', null);
    });
    if (window._forceRef) window._forceRef.resume();
  });
})();

    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 0);
  });
})();
